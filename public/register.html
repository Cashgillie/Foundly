<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundly · Create Account</title>
  <link rel="icon" type="image/png" href="foundly-logo-2(preview).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foundly.css">
</head>
<body data-page="register">
<header class="site-header">
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img id="foundly-logo-top" src="GCTU-Logo-640x640.webp" alt="Foundly illustration" onerror="this.style.display='none'">
      <span>GCTU Foundly</span>
    </a>
    <div class="nav-buttons">
      <a href="index.html" class="btn btn-outline"><i class="fas fa-home"></i> Home</a>
    </div>
  </nav>
  </div>
</header>
<div class="container">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
      <h2>Create your account</h2>
      <p class="auth-sub">Register to report lost items, bookmark listings, and track your reports.</p>

      <div class="auth-error" id="registerError"></div>
      <div class="auth-success" id="registerSuccess"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="Ama Mensah" required>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Phone (optional)</label>
          <input type="tel" id="phone" placeholder="024 000 0000">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required>
        </div>
        <button type="submit" class="submit-btn" id="registerBtn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>
<script type="module" src="js/register.js"></script>
</body>
</html>

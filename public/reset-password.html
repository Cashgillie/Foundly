<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundly · Set New Password</title>
  <link rel="icon" type="image/png" href="foundly-logo-2(preview).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foundly.css">
</head>
<body data-page="reset-password">
<header class="site-header">
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img id="foundly-logo-top" src="GCTU-Logo-640x640.webp" alt="Foundly illustration" onerror="this.style.display='none'">
      <span>GCTU Foundly</span>
    </a>
  </nav>
  </div>
</header>
<div class="container">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-icon"><i class="fas fa-lock"></i></div>
      <h2>Set a new password</h2>
      <p class="auth-sub">You've followed the reset link from your email — choose a new password below.</p>

      <div class="auth-error" id="formError"></div>
      <div class="auth-success" id="formSuccess"></div>

      <form id="resetForm">
        <div class="form-group">
          <label>New Password *</label>
          <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
          <small style="color:var(--gray);display:block;margin-top:4px">Needs an uppercase letter and a special character too (e.g. ! @ # $ %).</small>
        </div>
        <div class="form-group">
          <label>Confirm New Password *</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="8" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-check"></i> Update Password
        </button>
      </form>
    </div>
  </div>
</div>
<script type="module" src="js/reset-password.js"></script>
</body>
</html>

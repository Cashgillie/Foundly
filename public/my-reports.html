<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundly · My Reports</title>
  <link rel="icon" type="image/png" href="foundly-logo-2(preview).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foundly.css">
  <style>
    .page-hero.myreports-hero { background: linear-gradient(105deg, #151a68 0%, #f94144 120%); }
  </style>
</head>
<body data-page="my-reports">
<div class="page-gate-loader" id="pageGateLoader"><div class="page-gate-spinner"></div></div>
<header class="site-header">
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img id="foundly-logo-top" src="GCTU-Logo-640x640.webp" alt="Foundly illustration" onerror="this.style.display='none'">
      <span>GCTU Foundly</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html?type=lost">Lost</a>
      <a href="index.html?type=found">Found</a>
      <a href="index.html?type=bookmarks">Bookmarks</a>
    </div>
    <div class="nav-buttons">
      <a href="index.html?report=1" class="btn btn-report-lost"><i class="fas fa-triangle-exclamation"></i> Report Lost</a>
      <a href="profile.html" class="btn btn-outline"><i class="fas fa-user"></i></a>
      <button class="btn" id="navLogoutBtn" style="background:var(--danger);color:white;border:none">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>
  </div>
</header>
<div class="container">

  <section class="page-hero myreports-hero">
    <div class="page-hero-content">
      <h1><i class="fas fa-clipboard-list" style="margin-right:12px;opacity:0.9"></i>My Reports</h1>
      <p>Every lost item you've reported, and its current status.</p>
    </div>
  </section>

  <div class="data-table-wrapper">
    <table class="data-table">
      <thead>
        <tr><th></th><th>Item</th><th>Category</th><th>Reported</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="reportsTableBody">
        <tr><td colspan="6" style="text-align:center;padding:48px;color:var(--gray)">
          <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:12px"></i>Loading your reports…
        </td></tr>
      </tbody>
    </table>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal" id="editReportModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Report</h3>
        <button class="close-modal" onclick="closeEditReportModal()">&times;</button>
      </div>
      <form id="editReportForm">
        <input type="hidden" id="editReportId">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category *</label>
            <select id="editCategory" required></select>
          </div>
          <div class="form-group">
            <label>Location *</label>
            <input type="text" id="editLocation" required>
          </div>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea rows="4" id="editDescription" required></textarea>
        </div>
        <div class="form-group">
          <label>Contact Email *</label>
          <input type="email" id="editContact" required>
        </div>
        <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Save Changes</button>
      </form>
    </div>
  </div>
</div>
<script type="module" src="js/my-reports.js"></script>
</body>
</html>

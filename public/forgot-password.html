<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundly · Reset Password</title>
  <link rel="icon" type="image/png" href="foundly-logo-2(preview).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foundly.css">
</head>
<body data-page="forgot-password">
<header class="site-header">
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img id="foundly-logo-top" src="GCTU-Logo-640x640.webp" alt="Foundly illustration" onerror="this.style.display='none'">
      <span>GCTU Foundly</span>
    </a>
    <div class="nav-buttons">
      <a href="login.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </nav>
  </div>
</header>
<div class="container">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <h2>Forgot your password?</h2>
      <p class="auth-sub">Enter your email and we'll send you a link to reset it.</p>

      <div class="auth-error" id="formError"></div>
      <div class="auth-success" id="formSuccess"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div class="auth-footer-link">Remembered it? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>
<script type="module" src="js/forgot-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundly · Log In</title>
  <link rel="icon" type="image/png" href="foundly-logo-2(preview).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foundly.css">
</head>
<body data-page="login">
<header class="site-header">
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img id="foundly-logo-top" src="GCTU-Logo-640x640.webp" alt="Foundly illustration" onerror="this.style.display='none'">
      <span>GCTU Foundly</span>
    </a>
    <div class="nav-buttons">
      <a href="index.html" class="btn btn-outline"><i class="fas fa-home"></i> Home</a>
    </div>
  </nav>
  </div>
</header>
<div class="container">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-icon"><i class="fas fa-right-to-bracket"></i></div>
      <h2>Welcome back</h2>
      <p class="auth-sub">Log in to report items, view your reports, and manage bookmarks.</p>

      <div class="auth-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">
          <i class="fas fa-right-to-bracket"></i> Log In
        </button>
      </form>

      <p style="text-align:center;margin-top:14px">
        <a href="forgot-password.html" style="color:var(--gray);font-size:13px;text-decoration:none">Forgot your password?</a>
      </p>
      <div class="auth-footer-link">Don't have an account? <a href="register.html">Register</a></div>
    </div>
  </div>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
